id = "herdr-dock-grid"
name = "herdr-dock-grid"
version = "0.6.1"
min_herdr_version = "0.9.0"
platforms = ["windows", "linux", "macos"]
description = "Shared 2x2 pane grid and slot rules for the herdr-dock workspace used by herdr plugins"

[[actions]]
id = "list"
title = "dock: list docks"
platforms = ["linux", "macos"]
contexts = ["global"]
command = ["python3", "-X", "utf8", "src/dock_cli.py", "list"]

[[actions]]
id = "list-windows"
title = "dock: list docks"
platforms = ["windows"]
contexts = ["global"]
command = ["python", "-X", "utf8", "src/dock_cli.py", "list"]

[[actions]]
id = "reset"
title = "dock: clean up stale docks"
platforms = ["linux", "macos"]
contexts = ["global"]
command = ["python3", "-X", "utf8", "src/dock_cli.py", "reset"]

[[actions]]
id = "reset-windows"
title = "dock: clean up stale docks"
platforms = ["windows"]
contexts = ["global"]
command = ["python", "-X", "utf8", "src/dock_cli.py", "reset"]

[[actions]]
id = "snapshot"
title = "dock: save layout snapshot"
platforms = ["linux", "macos"]
contexts = ["global"]
command = ["python3", "-X", "utf8", "src/dock_cli.py", "snapshot"]

[[actions]]
id = "snapshot-windows"
title = "dock: save layout snapshot"
platforms = ["windows"]
contexts = ["global"]
command = ["python", "-X", "utf8", "src/dock_cli.py", "snapshot"]
